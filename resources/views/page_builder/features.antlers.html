<section class="jw_features_section">
	<div class="jw_container">
		<div class="jw_slider_arrow_wrap">
			<div class="jw_features_content">
				{{ if heading }}<h3 class="jw_sub_title_2" data-aos="fade-right" data-aos-duration="1000">{{ heading }}</h3>{{ /if }}
				{{ if text }}<p data-aos="fade-right" data-aos-duration="1000">{{ text }}</p>{{ /if }}
			</div>
			<div class="jw_features_slider_arrow">
				<div class="swiper-button-prev" data-aos="zoom-in" data-aos-duration="1000"><span class="material-symbols-sharp" aria-hidden="true">arrow_back_ios</span></div>
				<div class="swiper-button-next" data-aos="zoom-in" data-aos-duration="1000"><span class="material-symbols-sharp" aria-hidden="true">arrow_forward_ios</span></div>
			</div>
		</div>
		<div class="jw_features_wrap" data-aos="fade-up" data-aos-duration="1000">
			<div class="swiper mySwiper">
				<div class="swiper-wrapper">
					{{ slides }}
					<div class="swiper-slide">
						<div class="jw_features_images jw_images_cover">
							<img src="{{ partial:partials/media-url :file="image" fallback="image/images-6.jpg" }}" alt="">
						</div>
					</div>
					{{ /slides }}
				</div>
			</div>
		</div>
	</div>
</section>
