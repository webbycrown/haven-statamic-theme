<section class="jw_video_section">
	<div class="jw_container-fluid">
		<div class="jw_video_wrapper">
			{{ if image }}
			<div class="jw_video_wrap" data-aos="fade-up" data-aos-duration="1000">
				<div class="jw_video_images jw_images_cover content__item">
					<img class="content__item-img" src="{{ partial:partials/media-url :file="image" }}" alt="{{ title }}">
					<div class="jw_video_content_wrap">
						<div class="content__item-title">
							{{ if kicker }}<h3 class="jw_sub_wrap">{{ kicker }}</h3>{{ /if }}
							{{ if title }}<h2 class="jw_sub_title_wrap">{{ title }}</h2>{{ /if }}
						</div>
						{{ if video_url }}
						<div class="jw_video_play_btn_border">
							<div class="jw_video_play_btn">
								<a class="popup-vimeo" href="{{ video_url }}" aria-label="Play video"><i class="fa-solid fa-play" aria-hidden="true"></i></a>
							</div>
						</div>
						{{ /if }}
					</div>
				</div>
			</div>
			{{ /if }}
			<div class="jw_video_content">
				{{ if heading }}<h2>{{ heading }}</h2>{{ /if }}
				{{ if text }}<p>{{ text }}</p>{{ /if }}
				{{ if button_label }}
				{{ button_url }}
				<a class="jw_custom_buttom jw_explore_button" href="{{ url ?? '/about' }}"><span>{{ button_label }}</span><span class="jw_arrow_sharp"><img src="/assets/image/arrow.svg" alt=""></span></a>
				{{ /button_url }}
				{{ /if }}
			</div>
		</div>
	</div>
</section>
