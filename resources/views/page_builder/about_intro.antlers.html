<section class="jw_about_section">
	<div class="jw_container">
		<div class="jw_about_wrap content__item">
			<div class="jw_about_content">
				{{ if heading }}<h2 class="jw_sub_title" data-aos="fade-up" data-aos-duration="1000">{{ heading }}</h2>{{ /if }}
				{{ if text }}<p data-aos="fade-up" data-aos-duration="1000">{{ text }}</p>{{ /if }}
				{{ if button_label }}
				<a data-aos="fade-up" data-aos-duration="1000" class="jw_custom_buttom" href="{{ button_url ?? '/about' }}"><span>{{ button_label }}</span><span class="jw_arrow_sharp"><img src="/assets/image/arrow.svg" alt=""></span></a>
				{{ /if }}
			</div>
			{{ if image }}
			<div class="jw_about_images jw_images_cover" data-aos="flip-up" data-aos-duration="1000">
				<img class="content__item-img" src="{{ partial:partials/media-url :file="image" }}" alt="">
				<div class="content__item-title"></div>
			</div>
			{{ /if }}
		</div>
	</div>
</section>
