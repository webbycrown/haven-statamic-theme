title: Blog
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field: { type: text, required: true, validate: required }
          -
            handle: image
            field: { type: assets, container: assets, max_files: 1, display: Image }
          -
            handle: excerpt
            field: { type: textarea, display: Excerpt }
          -
            handle: content
            field: { type: markdown, display: Content }
          -
            handle: aside_title
            field: { type: text, display: 'Note title' }
          -
            handle: aside_text
            field: { type: textarea, display: 'Note text' }
          -
            handle: quote
            field: { type: textarea, display: Quote }
          -
            handle: aside_two_title
            field: { type: text, display: 'Second note title' }
          -
            handle: aside_two_text
            field: { type: textarea, display: 'Second note text' }
          -
            handle: image_two
            field: { type: assets, container: assets, max_files: 1, display: 'Side image' }
          -
            handle: image_three
            field: { type: assets, container: assets, max_files: 1, display: 'Second side image' }
          -
            handle: side_copy
            field: { type: markdown, display: 'Side copy' }
          -
            handle: closing
            field: { type: markdown, display: Closing }
