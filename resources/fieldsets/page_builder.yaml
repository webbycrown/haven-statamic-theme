title: 'Theme sections'
fields:
  -
    handle: page_builder
    field:
      type: replicator
      display: 'Theme sections'
      collapse: true
      sets:
        content:
          display: Content
          sets:
            home_hero:
              display: 'Home hero'
              fields:
                -
                  handle: slides
                  field:
                    type: grid
                    display: Slides
                    fields:
                      -
                        handle: image
                        field:
                          type: assets
                          container: assets
                          max_files: 1
                          display: Image
                      -
                        handle: title
                        field:
                          type: text
                          display: Title
                      -
                        handle: kicker
                        field:
                          type: text
                          display: Kicker
            about_intro:
              display: 'About intro'
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
                -
                  handle: image
                  field: { type: assets, container: assets, max_files: 1, display: Image }
                -
                  handle: button_label
                  field: { type: text, display: 'Button label' }
                -
                  handle: button_url
                  field: { type: link, display: 'Button URL', collections: [pages] }
            about_page:
              display: 'About page'
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: paragraphs
                  field:
                    type: grid
                    display: Paragraphs
                    fields:
                      -
                        handle: text
                        field: { type: textarea, display: Text }
                -
                  handle: image
                  field: { type: assets, container: assets, max_files: 1, display: Image }
                -
                  handle: lead
                  field: { type: textarea, display: Lead }
                -
                  handle: points
                  field:
                    type: grid
                    display: Points
                    fields:
                      -
                        handle: text
                        field: { type: textarea, display: Text }
                -
                  handle: image_two
                  field: { type: assets, container: assets, max_files: 1, display: 'Second image' }
                -
                  handle: year
                  field: { type: text, display: Year }
                -
                  handle: year_label
                  field: { type: text, display: 'Year label' }
                -
                  handle: notes
                  field:
                    type: grid
                    display: Notes
                    fields:
                      -
                        handle: text
                        field: { type: textarea, display: Text }
            collection_feature:
              display: 'Collection feature'
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
                -
                  handle: images
                  field:
                    type: grid
                    display: Images
                    fields:
                      -
                        handle: image
                        field: { type: assets, container: assets, max_files: 1, display: Image }
                      -
                        handle: label
                        field: { type: text, display: Label }
            explore_slider:
              display: 'Explore slider'
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
                -
                  handle: slides
                  field:
                    type: grid
                    display: Slides
                    fields:
                      -
                        handle: image
                        field: { type: assets, container: assets, max_files: 1, display: Image }
            video_feature:
              display: 'Video feature'
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
                -
                  handle: image
                  field: { type: assets, container: assets, max_files: 1, display: Image }
                -
                  handle: video_url
                  field: { type: text, display: 'Video URL' }
            home_hero_two:
              display: 'Home hero two'
              fields:
                -
                  handle: title
                  field: { type: text, display: Title }
                -
                  handle: kicker
                  field: { type: text, display: Kicker }
                -
                  handle: slides
                  field:
                    type: grid
                    display: Slides
                    fields:
                      -
                        handle: image_left
                        field: { type: assets, container: assets, max_files: 1, display: 'Left image' }
                      -
                        handle: image_right
                        field: { type: assets, container: assets, max_files: 1, display: 'Right image' }
            features:
              display: Features
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
                -
                  handle: slides
                  field:
                    type: grid
                    display: Slides
                    fields:
                      -
                        handle: image
                        field: { type: assets, container: assets, max_files: 1, display: Image }
            best_collection:
              display: 'Best collection'
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
                -
                  handle: button_label
                  field: { type: text, display: 'Button label' }
                -
                  handle: button_url
                  field: { type: link, display: 'Button URL', collections: [pages, products] }
                -
                  handle: images
                  field:
                    type: grid
                    display: Images
                    instructions: 'The first two sit above the heading. The next two sit below.'
                    fields:
                      -
                        handle: image
                        field: { type: assets, container: assets, max_files: 1, display: Image }
                      -
                        handle: label
                        field: { type: text, display: Label }
            explore_tiles:
              display: 'Explore tiles'
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
                -
                  handle: tiles
                  field:
                    type: grid
                    display: Tiles
                    fields:
                      -
                        handle: image
                        field: { type: assets, container: assets, max_files: 1, display: Image }
                      -
                        handle: kicker
                        field: { type: text, display: Kicker }
                      -
                        handle: title
                        field: { type: text, display: Title }
                      -
                        handle: button_label
                        field: { type: text, display: 'Button label' }
                      -
                        handle: button_url
                        field: { type: link, display: 'Button URL', collections: [pages, products] }
                -
                  handle: view_more_label
                  field: { type: text, display: 'View more label' }
                -
                  handle: view_more_url
                  field: { type: link, display: 'View more URL', collections: [pages] }
            video_story:
              display: 'Video story'
              fields:
                -
                  handle: image
                  field: { type: assets, container: assets, max_files: 1, display: Image }
                -
                  handle: kicker
                  field: { type: text, display: Kicker }
                -
                  handle: title
                  field: { type: text, display: Title }
                -
                  handle: video_url
                  field: { type: text, display: 'Video URL', instructions: 'Leave empty to show the still without a play button.' }
                -
                  handle: heading
                  field: { type: textarea, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
                -
                  handle: button_label
                  field: { type: text, display: 'Button label' }
                -
                  handle: button_url
                  field: { type: link, display: 'Button URL', collections: [pages] }
            newsletter:
              display: Newsletter
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
                -
                  handle: placeholder
                  field: { type: text, display: Placeholder }
                -
                  handle: image_left
                  field: { type: assets, container: assets, max_files: 1, display: 'Top left image' }
                -
                  handle: image_left_title
                  field: { type: text, display: 'Top left label' }
                -
                  handle: image_right
                  field: { type: assets, container: assets, max_files: 1, display: 'Top right image' }
                -
                  handle: image_right_title
                  field: { type: text, display: 'Top right label' }
                -
                  handle: image_bottom_left
                  field: { type: assets, container: assets, max_files: 1, display: 'Bottom left image' }
                -
                  handle: image_bottom_left_title
                  field: { type: text, display: 'Bottom left label' }
                -
                  handle: image_bottom_right
                  field: { type: assets, container: assets, max_files: 1, display: 'Bottom right image' }
                -
                  handle: image_bottom_right_title
                  field: { type: text, display: 'Bottom right label' }
            contact_form:
              display: 'Contact form'
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
            contact_details:
              display: 'Contact details'
              fields:
                -
                  handle: address
                  field: { type: textarea, display: Address }
                -
                  handle: phone
                  field: { type: text, display: Phone }
                -
                  handle: email
                  field: { type: text, display: Email, input_type: email }
            heading_banner:
              display: 'Heading banner'
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
            legal_copy:
              display: 'Legal copy'
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: body
                  field: { type: textarea, display: Body }
        listings:
          display: Listings
          sets:
            shop_products:
              display: 'Shop products'
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
                -
                  handle: style
                  field:
                    type: select
                    display: Style
                    options:
                      grid: Grid
                      page: 'Shop page'
                      list: 'Shop now'
                      masonry: Masonry
                      collection: Collection
                      featured: Featured
                    default: grid
                -
                  handle: limit
                  field: { type: integer, display: Limit, default: 8 }
                -
                  handle: show_all_label
                  field: { type: text, display: 'Show all label' }
                -
                  handle: show_all_url
                  field: { type: link, display: 'Show all URL', collections: [pages] }
            blogs:
              display: Blogs
              fields:
                -
                  handle: heading
                  field: { type: text, display: Heading }
                -
                  handle: text
                  field: { type: textarea, display: Text }
                -
                  handle: style
                  field:
                    type: select
                    display: Style
                    options:
                      grid: Grid
                      page: 'Blog page'
                      classic: 'Card grid'
                      masonry: Masonry
                      latest: 'Latest slider'
                    default: grid
                -
                  handle: limit
                  field: { type: integer, display: Limit, default: 3 }
                -
                  handle: button_label
                  field: { type: text, display: 'Read more label' }
