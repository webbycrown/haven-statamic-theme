title: SEO
fields:
  -
    handle: seo_title
    field:
      type: text
      display: 'SEO title'
      instructions: 'Browser tab and shared-link title. Leave empty to use the entry title.'
      character_limit: 70
  -
    handle: seo_description
    field:
      type: textarea
      display: 'SEO description'
      instructions: 'Search and social description. Leave empty to use the excerpt or product description, then the Setting default.'
      character_limit: 160
  -
    handle: seo_image
    field:
      type: assets
      container: assets
      max_files: 1
      display: 'Social image'
      instructions: 'Image for a shared link. Leave empty to use this entry image, then the Setting default.'
  -
    handle: seo_robots
    field:
      type: select
      display: Robots
      default: 'index, follow'
      options:
        'index, follow': 'Index, follow'
        'noindex, follow': 'No index, follow'
        'index, nofollow': 'Index, no follow'
        'noindex, nofollow': 'No index, no follow'
